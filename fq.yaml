# HTTP 代理端口
port: 7890 

# SOCKS5 代理端口
socks-port: 7891 

# Linux 和 macOS 的 redir 代理端口
redir-port: 7892
# HTTP/SOCKS 合并端口，新客户端（Clash Verge / Party 等）默认使用；老内核忽略未知字段
mixed-port: 7893

# 允许局域网的连接
allow-lan: true

# allow-lan 时监听的网卡范围，显式声明避免依赖内核默认值
bind-address: '*'

# 规则模式：Rule（规则） / Global（全局代理）/ Direct（全局直连）
mode: Rule

# 统一延迟计算方式，便于 url-test 按更可比的延迟选择节点（具体算法依内核版本）
unified-delay: true

# TCP 握手阶段并发，弱网或多线路时常常可以略微加快建立速度
tcp-concurrent: true

# 设置日志输出级别 (默认级别：silent，即不输出任何内容，以避免因日志内容过大而导致程序内存溢出）。
# 5 个级别：silent / info / warning / error / debug。级别越高日志输出量越大，越倾向于调试，若需要请自行开启。
log-level: silent
# Clash 的 RESTful API：仅监听本机回环，避免局域网设备无鉴权控制客户端（issue #27 对照 YepFast）
# 如需局域网控制面板，请自行改回 0.0.0.0 并务必设置随机 secret
external-controller: '127.0.0.1:9090'

# RESTful API 的口令
secret: '' 

# 您可以将静态网页资源（如 clash-dashboard）放置在一个目录中，clash 将会服务于 `RESTful API/ui`
# 参数应填写配置目录的相对路径或绝对路径。
# external-ui: folder


